# ─────────────────────────────────────────────────────────────────────────────
# Yorki — Nginx config for Raspberry Pi deployment
#
# TWO OPTIONS for HTTPS (required — session cookie won't work without it):
#
# OPTION A — Tailscale Funnel (recommended for Pi, easiest)
#   1. Install Tailscale on Pi: curl -fsSL https://tailscale.com/install.sh | sh
#   2. Run: sudo tailscale funnel 3000
#   Tailscale handles SSL automatically. Skip nginx entirely or use it just
#   as a local reverse proxy on port 80.
#
# OPTION B — Let's Encrypt (requires a public domain)
#   1. Point your domain DNS to the Pi's public IP
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Run: sudo certbot --nginx -d yourdomain.com
#   4. Replace YOUR_DOMAIN below with your domain
#
# Place at:  /etc/nginx/sites-available/yorki
# Enable:    sudo ln -s /etc/nginx/sites-available/yorki /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (backup to app-level rate limiting)
limit_req_zone $binary_remote_addr zone=yorki_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=yorki_api:10m   rate=60r/m;

log_format yorki '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time';

# Upstream — Next.js (Docker or direct)
upstream yorki_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
  listen      80;
  server_name YOUR_DOMAIN;    # e.g. yorki.yourdomain.com
  return      301 https://$host$request_uri;
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
  listen      443 ssl http2;
  server_name YOUR_DOMAIN;

  access_log /var/log/nginx/yorki-access.log yorki;
  error_log  /var/log/nginx/yorki-error.log warn;

  # Let's Encrypt — run certbot first
  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_stapling              on;
  ssl_stapling_verify       on;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options           "SAMEORIGIN"                           always;
  add_header X-Content-Type-Options    "nosniff"                              always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

  # File uploads up to 15MB
  client_max_body_size 15M;

  # Gzip
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Login endpoint — strict rate limit
  location /task/login {
    limit_req zone=yorki_login burst=3 nodelay;
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  # Auth API — strict rate limit
  location /task/api/auth {
    limit_req zone=yorki_login burst=5 nodelay;
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  # Live board updates (Server-Sent Events) — must not be buffered, and the
  # connection stays open for minutes. Not rate-limited: one per open tab.
  location /task/api/board/stream {
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
    proxy_buffering    off;
    proxy_cache        off;
    gzip               off;
    proxy_read_timeout 15m;
  }

  # Presence heartbeats ("who has this card open") — ~4/min per open card.
  location /task/api/board/presence {
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  # General API
  location /task/api {
    limit_req zone=yorki_api burst=30 nodelay;
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  # Static assets — immutable cache
  location /task/_next/static {
    proxy_pass http://yorki_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # Everything else
  location /task {
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  # Root → the canonical Next.js base path. Do not add a trailing slash:
  # Next.js canonicalizes `/task/` to `/task`, and conflicting slash redirects
  # cause an infinite redirect loop.
  location = / {
    return 302 /task;
  }
}
