# Server block for task.goldenstoneworks.com (certificates managed by certbot).
# The app serves everything under /task itself, so nginx must pass /task/... through UNCHANGED:
# no stripping the prefix, no rewrites.
upstream yorki_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name task.goldenstoneworks.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name task.goldenstoneworks.com;

  ssl_certificate /etc/letsencrypt/live/task.goldenstoneworks.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/task.goldenstoneworks.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 15M;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = / { return 301 /task/; }
  location = /task { return 308 /task/; }

  # Live board updates (server-sent events): must not be buffered.
  location = /task/api/board/stream {
    proxy_pass http://yorki_app;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    include /etc/nginx/snippets/proxy-params.conf;
  }

  location /task/_next/static/ {
    proxy_pass http://yorki_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /task/ {
    proxy_pass http://yorki_app;
    include /etc/nginx/snippets/proxy-params.conf;
  }
}
