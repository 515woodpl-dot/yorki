name: Verify release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run type-check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: bash -n scripts/deploy-staged.sh scripts/rollback.sh scripts/backup.sh scripts/predeploy-backup.sh scripts/healthcheck.sh backup.sh
